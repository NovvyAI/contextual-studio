<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>创意视频工作台 · Contextual Studio</title>
    <link rel="stylesheet" href="/styles.css?v=20260831-7" />
    <style>
      .artifact-preview-item{min-width:0;margin:0;border:1px solid #30362c;border-radius:8px;background:#11140f;overflow:hidden}
      .artifact-preview-item .artifact-preview-link{border-radius:0}
      .artifact-preview-caption{margin:0;padding:9px 10px;color:#b8c0b2;font-size:10px;line-height:1.55;white-space:pre-wrap}
      .chat-current-task{flex:none;margin:10px 12px 0;padding:10px 11px;border:1px solid #637443;border-radius:10px;background:#1b2116;box-shadow:0 8px 22px #0005}
      .chat-current-task-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
      .chat-current-task-copy{min-width:0}.chat-current-task-copy small{display:block;color:#a8c85b;font-size:8px;letter-spacing:.12em}.chat-current-task-copy strong{display:block;margin-top:4px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chat-current-task-copy p{margin:4px 0 0;color:#929b8a;font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
      .chat-current-task button{flex:none;border:1px solid #819752;border-radius:7px;background:#29331f;color:#deefac;padding:7px 9px;font-size:9px;font-weight:700;cursor:pointer}.chat-current-task button:hover{background:#354228}.chat-current-task button:disabled{opacity:.5;cursor:default}
      .current-task-highlight{border-color:#a6c45c!important;box-shadow:0 0 0 3px #a6c45c55!important}
    </style>
  </head>
  <body class="workbench-page">
    <header class="workspace-topbar">
      <button id="close-workbench" class="workspace-back" type="button">← 返回项目列表</button>
      <div class="workspace-identity">
        <span class="brand-mark">N</span>
        <div><small>CREATIVE VIDEO WORKBENCH</small><h1 id="workbench-title">正在打开工作台…</h1></div>
      </div>
      <span id="workbench-status" class="status analyzing">载入中</span>
    </header>
    <main class="workbench-shell">
      <div class="workbench-grid">
        <section class="canvas-panel">
          <div class="canvas-toolbar"><div><small>CANVAS</small><strong>片尾创意画布</strong></div><div class="canvas-zoom">9:16 · 15s</div></div>
          <div id="source-strip" class="source-strip"></div>
          <div id="creative-canvas" class="creative-canvas"><div class="canvas-loading"><div class="loader"></div><strong>正在载入创意画布</strong></div></div>
        </section>
        <div id="workbench-resizer" class="workbench-resizer" role="separator" aria-label="调整画布与聊天框宽度" aria-orientation="vertical" aria-valuemin="35" aria-valuemax="72" aria-valuenow="67" tabindex="0" title="拖动调整宽度，双击恢复默认"></div>
        <aside class="chat-panel">
          <div id="chat-drop-overlay" class="chat-drop-overlay" aria-hidden="true"><strong>松开即可添加图片或视频</strong><small>最多 6 个附件</small></div>
          <div class="chat-header"><div class="chat-avatar">N</div><div><strong>Novvy 创意助手</strong><small>智能创意协作 · 持续保存</small></div></div>
          <div id="chat-current-task" class="chat-current-task"></div>
          <div id="creative-messages" class="chat-messages"></div>
          <form id="creative-chat-form" class="chat-compose">
            <div id="chat-attachment-preview" class="chat-attachment-preview"></div>
            <textarea id="creative-chat-input" rows="3" placeholder="输入消息，也可以添加图片或视频…"></textarea>
            <div class="chat-compose-actions">
              <label id="chat-attachment-button" class="chat-attachment-button">＋ 图片或视频<input id="chat-attachment-input" type="file" accept="image/jpeg,image/png,image/webp,video/*" multiple></label>
              <small id="chat-attachment-hint">最多 6 个附件</small>
              <button id="creative-send" type="submit">发送 ↑</button>
            </div>
          </form>
        </aside>
      </div>
    </main>
    <dialog id="source-analysis-dialog" class="source-analysis-dialog">
      <div class="source-analysis-shell">
        <header class="source-analysis-header">
          <div><small id="source-analysis-kind"></small><h2 id="source-analysis-title"></h2></div>
          <button id="source-analysis-close" type="button" aria-label="关闭完整分析">×</button>
        </header>
        <div id="source-analysis-body" class="source-analysis-body"></div>
      </div>
    </dialog>
    <script type="module" src="/workbench.js?v=20260831-7"></script>
  </body>
</html>
